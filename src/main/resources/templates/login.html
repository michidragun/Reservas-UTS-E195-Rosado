<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Reservas de Aulas</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>🏫 ReservaAulas</h1>
            <p>Sistema de Reserva de Aulas</p>
        </div>
        
        <div id="alerta" class="alert hidden"></div>
        
        <div class="form-group">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" 
                   placeholder="tu@email.com">
        </div>
        
        <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" 
                   placeholder="••••••••">
        </div>
        
        <button id="btnLogin" class="btn btn-primary btn-block btn-lg" 
                onclick="iniciarSesion()">
            Iniciar Sesión
        </button>
        
        <div class="auth-divider">
            <span>¿No tienes cuenta?</span>
        </div>
        
        <a href="/registro" class="btn btn-outline btn-block">
            Crear cuenta nueva
        </a>
    </div>
</div>

<script src="/js/firebase-init.js"></script>
<script>
	async function iniciarSesion() {
	    const email = document.getElementById('email').value.trim();
	    const password = document.getElementById('password').value;
	    const btn = document.getElementById('btnLogin');
	    
	    if (!email || !password) {
	        mostrarAlerta('alerta', 'Por favor completa todos los campos.');
	        return;
	    }
	    
	    btn.disabled = true;
	    btn.innerHTML = '<div class="loader"></div> Iniciando sesión...';
	    ocultarAlerta('alerta');
	    
	    try {
	        console.log('🔐 Intentando login con Firebase...');
	        
	        // Inicia sesión con Firebase
	        const userCredential = await auth.signInWithEmailAndPassword(email, password);
	        console.log('✅ Firebase Auth OK, usuario:', userCredential.user.email);
	        
	        // Obtiene el token
	        const token = await userCredential.user.getIdToken(true); // true = forzar refresh
	        console.log('🎫 Token obtenido, enviando al servidor...');
	        
	        // Envía el token al servidor Spring Boot
	        const response = await fetch('/api/auth/session', {
	            method: 'POST',
	            headers: { 'Content-Type': 'application/json' },
	            body: JSON.stringify({ token })
	        });
	        
	        console.log('📡 Respuesta del servidor, status:', response.status);
	        const result = await response.json();
	        console.log('📦 Datos de respuesta:', result);
	        
	        if (result.success) {
	            console.log('🚀 Redirigiendo a:', result.redirect);
	            window.location.href = result.redirect;
	        } else {
	            mostrarAlerta('alerta', result.error || 'Error al iniciar sesión');
	            btn.disabled = false;
	            btn.innerHTML = 'Iniciar Sesión';
	        }
	    } catch (error) {
	        console.error('💥 Error completo:', error);
	        let mensaje = 'Error al iniciar sesión';
	        if (error.code === 'auth/user-not-found') 
	            mensaje = 'No existe una cuenta con ese correo';
	        else if (error.code === 'auth/wrong-password' || 
	                 error.code === 'auth/invalid-credential') 
	            mensaje = 'Correo o contraseña incorrectos';
	        else if (error.code === 'auth/invalid-email') 
	            mensaje = 'Correo electrónico inválido';
	        else if (error.code === 'auth/too-many-requests') 
	            mensaje = 'Demasiados intentos. Espera unos minutos';
	        else
	            mensaje = 'Error: ' + (error.message || error.code);
	        
	        mostrarAlerta('alerta', mensaje);
	        btn.disabled = false;
	        btn.innerHTML = 'Iniciar Sesión';
	    }
	}
    
    // Permite usar Enter para hacer login
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') iniciarSesion();
    });
</script>
</body>
</html>
